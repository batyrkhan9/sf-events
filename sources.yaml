# Where to look for events.
#
# Every source has a `name` and a `type`:
#   page   — a URL to fetch and parse (needs `url`)
#   search — a web search query run through the Claude API (needs `query`)
#
# Add `enabled: false` to mute a source without losing its URL.

sources:
  # --- Event platforms -------------------------------------------------
  - name: Luma SF
    type: page
    url: https://lu.ma/sf

  # lu.ma/ai is a category landing page — it lists calendars, not events,
  # and returned zero. The city-scoped feed is the one with events in it.
  - name: Luma AI SF
    type: page
    url: https://lu.ma/ai-sf

  # Different platform from Luma, so genuinely different events. Also the
  # only source so far whose JSON-LD carries a description, which is where
  # one_liner comes from for free.
  - name: Meetup SF Tech
    type: page
    url: https://www.meetup.com/find/?location=us--ca--San%20Francisco&source=EVENTS&categoryId=546

  # Has full event data, but a San Francisco URL returns Hong Kong
  # conferences and repeats the same event three times. Needs a location
  # check and the step-6 dedup before it's trustworthy.
  - name: Eventbrite SF Tech
    type: page
    url: https://www.eventbrite.com/d/ca--san-francisco/technology--events/

  # Muted: the public discover feed is a consumer product. Its five SF
  # entries were a candle class, a picnic, a photo walk, a pastry pop-up
  # and "Berkeley Nights" — zero professional events. URL kept in case
  # Partiful ever exposes something closer to what we want.
  - name: Partiful Discover
    type: page
    url: https://partiful.com/discover
    enabled: false

  # --- Company events --------------------------------------------------
  # These companies don't keep one scrapable events page, so search
  # instead of guessing at a URL that will rot.
  #
  # Muted until step 5. Web search costs $10 per 1,000 searches (~$1/month
  # at 3 searches a day) where the page sources above are free to read.
  # Turning these on is the whole reason `enabled` exists.
  - name: Google SF
    type: search
    query: Google San Francisco Bay Area tech talk or developer event this week
    enabled: false

  - name: Nvidia SF
    type: search
    query: Nvidia San Francisco Bay Area AI event or meetup this week
    enabled: false

  - name: OpenAI SF
    type: search
    query: OpenAI San Francisco event demo day or developer meetup this week
    enabled: false
